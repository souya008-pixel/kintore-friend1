<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレ計画 — 理想体型プランナー</title>
<meta name="description" content="身長・体重から理想の体型までの期間を計算し、自重・ダンベルの週間メニューと毎日の摂取カロリーを作ります">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="筋トレ計画">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --page:#f3f3f0; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --accent:#2a78d6; --accent-ink:#fff; --accent-wash:rgba(42,120,214,.10);
  --ph-cut:#2a78d6; --ph-bulk:#eb6834; --ph-keep:#1baf7a;
  --good:#006300; --warn:#8a5a00; --warn-wash:#fff4dc;
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
    --accent:#3987e5; --accent-ink:#fff; --accent-wash:rgba(57,135,229,.16);
    --ph-cut:#3987e5; --ph-bulk:#d95926; --ph-keep:#199e70;
    --good:#0ca30c; --warn:#fab219; --warn-wash:#2a2410;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
body.no-nav{padding-bottom:24px}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--page);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.top #sub{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:12px 12px 0}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.card h3{font-size:14px;margin:14px 0 6px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--ink);background:var(--card);white-space:nowrap}
.badge i{width:9px;height:9px;border-radius:50%;display:inline-block}
.badge.plain{color:var(--ink2)}
.note{background:var(--warn-wash);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.note b{color:var(--warn)}
/* hero & tiles */
.hero-l{font-size:13px;color:var(--ink2)}
.hero{font-size:52px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.hero small{font-size:18px;font-weight:500;margin-left:4px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .v{font-size:20px;font-weight:600}
.tile .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:2px}
.tile .s{font-size:11.5px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
/* day cards */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day-h{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.day-h::-webkit-details-marker{display:none}
.day-d{min-width:58px}
.day-d b{font-size:16px;display:block;line-height:1.2}
.day-d span{font-size:12px;color:var(--ink2)}
.day-t{flex:1;min-width:0}
.day-t b{display:block;font-size:15px}
.day-t span{font-size:12px;color:var(--ink2)}
.day-k{text-align:right}
.day-k b{font-size:17px;font-variant-numeric:tabular-nums}
.day-k span{font-size:11px;color:var(--ink2);display:block;line-height:1}
.chev{color:var(--muted);transition:transform .15s}
details[open]>.day-h .chev{transform:rotate(90deg)}
.day-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.meta{font-size:12.5px;color:var(--ink2);padding:8px 0 2px}
.tag-today{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.done-n{font-size:11px;color:var(--good);display:block}
ol.ex{list-style:none;margin:6px 0 0;padding:0}
ol.ex li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ol.ex li:first-child{border-top:0}
ol.ex li.wu{color:var(--ink2);font-size:13px;padding:7px 0}
.chk{flex:none;position:relative;width:26px;height:26px;margin-top:1px}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{position:absolute;inset:0;border:2px solid var(--axis);border-radius:8px;pointer-events:none}
.chk input:checked+span{background:var(--accent);border-color:var(--accent)}
.chk input:checked+span::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ex-b{flex:1;min-width:0}
.ex-n{font-weight:600}
.ex-n .role{font-size:11px;font-weight:500;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.ex-rx{font-size:13.5px}
.ex-rx b{font-weight:700}
.ex-rx .w{white-space:nowrap}
li.is-done .ex-n,li.is-done .ex-rx{opacity:.55}
details.tip summary{font-size:12px;color:var(--accent);cursor:pointer;width:max-content}
details.tip p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.rest-act{padding:10px 0 2px}
/* meals */
.meals{margin-top:4px}
.meal{border-top:1px solid var(--line);padding:9px 0 7px}
.meal:first-child{border-top:0}
.meal-h{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.meal-h b{white-space:nowrap}
.meal-h .mp{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meal-h .mk{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.reroll{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:32px;cursor:pointer;color:var(--accent);font-size:17px;line-height:1}
.reroll:active{background:var(--accent-wash)}
ul.foods{list-style:none;margin:4px 0 0;padding:0}
ul.foods li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0 2px 2px}
ul.foods li::before{content:"・";color:var(--muted);margin-right:-6px}
ul.foods li span:first-child{flex:1}
ul.foods .amt{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mtot{margin:6px 0 0;padding-top:8px;border-top:1px solid var(--line)}
details.mealbox{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.mealbox>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.dows.ng{grid-template-columns:repeat(5,1fr)}
.dows.ng span{font-weight:500;font-size:13.5px}
.rest-act b{display:block}
/* week nav */
.wnav{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.wnav button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.wnav button:disabled{opacity:.35}
.wnav select{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-weight:600}
/* setup form */
.f{margin:0 0 14px}
.f>label,.f>.lbl{display:block;font-size:13px;color:var(--ink2);margin:0 0 4px}
.f input[type=number],.f input[type=date],.f select{width:100%;height:44px;border-radius:10px;border:1px solid var(--axis);background:var(--card);padding:0 12px;font-size:16px}
.f.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f.two label{display:block;font-size:13px;color:var(--ink2);margin:0 0 4px}
.seg{display:flex;border:1px solid var(--axis);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:9px 4px;font-size:14.5px}
.seg label+label span{border-left:1px solid var(--axis)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-3px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{position:relative;border:1px solid var(--axis);border-radius:12px;padding:10px 10px 9px;cursor:pointer;min-height:76px}
.goal input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.goal b{display:block;font-size:14.5px}
.goal span{display:block;font-size:12px;color:var(--ink2);line-height:1.45}
.goal:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-wash)}
.goal:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dows label{position:relative;text-align:center}
.dows input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.dows span{display:block;border:1px solid var(--axis);border-radius:10px;padding:8px 0;font-weight:600}
.dows input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dows input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--ink2);margin-top:4px}
.err{color:#d03b3b;font-size:13px;margin-top:4px}
.btn{display:block;width:100%;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;cursor:pointer}
.btn.sub{background:transparent;color:var(--accent);border:1px solid var(--accent);height:42px;font-size:14.5px;font-weight:600}
.btn.danger{background:transparent;color:#d03b3b;border:1px solid var(--line);height:42px;font-size:14px;font-weight:500}
.inl{display:flex;gap:8px}
.inl input{flex:1;height:44px;border-radius:10px;border:1px solid var(--axis);background:var(--card);padding:0 12px;font-size:16px;min-width:0}
.inl button{flex:none;width:96px;height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
/* phase bar + chart */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .lk{width:16px;height:0;border-top:2px solid;display:inline-block}
.legend .dk{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block}
.pbar{display:flex;gap:2px;height:28px;margin:0 0 4px}
.pbar div{border-radius:4px;color:#fff;font-size:12px;font-weight:600;line-height:28px;padding:0 6px;white-space:nowrap;overflow:hidden;min-width:3px}
.chart-wrap{position:relative;margin-top:6px}
#chart{width:100%;height:230px;touch-action:pan-y}
#chart svg{display:block;width:100%;height:100%;overflow:visible}
#chart .hit{fill:transparent;cursor:crosshair}
#chart .hit:focus{outline:none}
#chart:focus-within .hit{outline:none}
.tt{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:150px;display:none;z-index:2}
.tt .h{color:var(--ink2);margin-bottom:2px}
.tt .r{display:flex;align-items:center;gap:6px}
.tt .r b{font-size:14px}
.tt .r i{width:12px;border-top:2px solid;display:inline-block}
.tt .r em{font-style:normal;color:var(--ink2)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tbl th:nth-child(-n+3),table.tbl td:nth-child(-n+3){text-align:left}
table.tbl thead th{color:var(--ink2);font-weight:500;position:sticky;top:0;background:var(--card)}
.tblbox{max-height:340px;overflow:auto;margin-top:8px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:4px 0}
.prose{font-size:13.5px;color:var(--ink2)}
.prose p{margin:6px 0}
.prose ul{margin:6px 0;padding-left:1.2em}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink2);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700}
body.no-nav nav.tabs{display:none}
#installTip{position:relative;background:var(--accent-wash);border-radius:12px;padding:10px 34px 10px 12px;font-size:13px;margin:0 0 12px;display:none}
#installTip button{position:absolute;right:6px;top:6px;border:0;background:none;font-size:18px;line-height:1;padding:4px 8px;cursor:pointer;color:var(--ink2)}
@media (min-width:560px){.goals{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header class="top"><h1>筋トレ計画</h1><span id="sub"></span></header>
<main>
  <div id="installTip" role="note"><button id="installX" aria-label="閉じる">×</button>📱 <b>アプリとして使う：</b>Safariの共有ボタン（□に↑）→「ホーム画面に追加」で、アイコンから全画面で開けます。</div>
  <section id="v-today" class="view" aria-label="今日"></section>
  <section id="v-week" class="view" aria-label="1週間のメニュー"></section>
  <section id="v-plan" class="view" aria-label="計画"></section>
  <section id="v-setup" class="view" aria-label="設定"></section>
</main>
<nav class="tabs" aria-label="画面切り替え">
  <button data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button data-v="week"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7 13.5h3M14 13.5h3M7 17h3"/></svg>週メニュー</button>
  <button data-v="plan"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>計画</button>
  <button data-v="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>プロフィール</button>
</nav>
<script src="app.js"></script>
</body>
</html>
